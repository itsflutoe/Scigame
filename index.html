<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Lab | Chicken Life Cycle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <div class="app">

        <!-- Progress -->
        <div class="progress-wrapper">
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
            <span id="progressText">0 / 5</span>
        </div>

        <!-- HOME -->
        <section id="homeScreen" class="screen active">
            <div class="card">
                <div class="badge">Mission 1</div>
                <h1 class="title">Animal Lab</h1>
                <div class="hero">🐔</div>
                <h2 class="subtitle">Chicken Life Cycle</h2>
                <p class="home-desc">Learn the 5 stages of a chicken’s life by speaking the answers!</p>
                <button id="startBtn" class="mainBtn">START MISSION</button>
            </div>
        </section>

        <!-- GAME -->
        <section id="gameScreen" class="screen">
            <div class="card">
                <h2 id="question">What is the first stage?</h2>

                <!-- Single current stage display -->
                <div class="current-stage" id="currentStageBox">
                    <div class="stage-image" id="stageImage">🥚</div>
                    <div class="stage-name" id="stageName">Eggs</div>
                </div>

                <div class="mic-area">
                    <button id="micBtn" class="micBtn" aria-label="Speak answer">
                        <span class="mic-icon">🎤</span>
                    </button>
                    <p class="mic-hint">Tap the mic or press <kbd>Space</kbd></p>
                </div>

                <div id="heardBox" class="heard-box">
                    <span class="heard-label">I heard:</span>
                    <span id="heardText">—</span>
                </div>

                <div id="feedback"></div>
            </div>
        </section>

        <!-- COMPLETE -->
        <section id="completeScreen" class="screen">
            <div class="card">
                <div class="stars">⭐⭐⭐⭐⭐</div>
                <h1>Mission Complete!</h1>
                <p class="complete-msg">Great Job!</p>
                <div class="finishedCycle">
                    🥚 ➜ 🧬 ➜ 🐣 ➜ 🐥 ➜ 🐔
                </div>
                <button id="restartBtn" class="mainBtn">PLAY AGAIN</button>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
